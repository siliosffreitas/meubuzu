services:
  db:
    image: postgis/postgis:17-3.5
    # A imagem oficial do PostGIS ainda não publica build arm64.
    # Em Apple Silicon roda via emulação (Rosetta).
    platform: linux/amd64
    container_name: meubuzu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meubuzu
      POSTGRES_USER: meubuzu
      POSTGRES_PASSWORD: meubuzu
    ports:
      - "5432:5432"
    volumes:
      - meubuzu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meubuzu -d meubuzu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meubuzu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: meubuzu_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  meubuzu_pgdata:
